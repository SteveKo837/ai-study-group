<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>機櫃群推論旅程地圖 — 一個 DeepSeek 請求穿過數個機櫃</title>
<style>
  :root {
    --bg: #0E1726; --bg2: #16233A; --bg3: #1C2E4A;
    --ink: #EAF1FB; --mute: #8FA6C4; --line: #2A3D5C; --foot: #5C7299;
    --mem: #38BDF8; --comp: #F59E0B; --warn: #FB7185; --good: #34D399; --purp: #A78BFA;
    --memtint: #10455F; --comptint: #4A3410; --warntint: #4A2433; --goodtint: #123D31; --purptint: #2A2150;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif; overflow: hidden; user-select: none; }
  button { font-family: inherit; }
  svg text { font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  .mono, svg text.mono { font-family: Menlo, ui-monospace, monospace; }

  /* ---------- 頂列 ---------- */
  #topbar { display: flex; align-items: center; gap: 14px; padding: 10px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #crumbs, #hwsw { display: flex; align-items: center; gap: 6px; font-size: 13.5px; flex-wrap: wrap; }
  .crumb { padding: 4px 11px; border-radius: 8px; cursor: pointer; background: var(--bg2); color: var(--mute); border: 1px solid var(--line); transition: all .15s; }
  .crumb:hover { color: var(--ink); border-color: var(--mem); }
  .crumb.active { background: var(--mem); color: var(--bg); font-weight: 700; border-color: var(--mem); }
  .sep { color: var(--foot); }
  #hwsw { padding-left: 12px; border-left: 1px solid var(--line); }
  #hwsw .lab { color: var(--foot); font-size: 11.5px; margin-right: 2px; }
  .hwbtn { padding: 4px 10px; border-radius: 8px; cursor: pointer; background: var(--bg2); color: var(--mute); border: 1px solid var(--line); font-size: 12.5px; }
  .hwbtn kbd { font-family: Menlo, monospace; font-size: 9.5px; color: var(--foot); margin-left: 4px; }
  .hwbtn:hover { color: var(--ink); }
  .hwbtn.on { background: var(--comptint); border-color: var(--comp); color: var(--comp); font-weight: 700; }
  .hwbtn.on kbd { color: var(--comp); }
  #hint { margin-left: auto; color: var(--foot); font-size: 11.5px; }
  #hint kbd { background: var(--bg3); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-family: Menlo, monospace; font-size: 10.5px; color: var(--mute); }

  /* ---------- 版面 ---------- */
  #stage { display: flex; height: calc(100% - 50px); }
  #canvas { flex: 1; position: relative; overflow: auto; }
  .lvwrap { display: flex; flex-direction: column; gap: 14px; padding: 18px 24px 28px; min-width: 760px; animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }

  #panel { width: 372px; flex-shrink: 0; border-left: 1px solid var(--line); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  #panel h2 { font-size: 18.5px; line-height: 1.3; }
  #panel h2 .lv { color: var(--mem); font-family: Menlo, monospace; font-size: 12px; display: block; margin-bottom: 3px; }
  #panel p.desc { color: var(--mute); font-size: 13px; line-height: 1.65; }
  #panel p.desc b { color: var(--ink); }
  table.facts { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.facts td { padding: 6px 8px; border: 1px solid var(--line); vertical-align: top; line-height: 1.45; }
  table.facts td:first-child { color: var(--mute); width: 40%; }
  table.facts td.v { font-family: Menlo, "PingFang TC", monospace; color: var(--mem); font-weight: 700; }
  .teach { background: var(--bg2); border-left: 4px solid var(--comp); border-radius: 6px; padding: 11px 13px; font-size: 12.5px; line-height: 1.65; }
  .teach b { color: var(--comp); }
  .caveat { color: var(--foot); font-size: 11px; line-height: 1.6; border-top: 1px dashed var(--line); padding-top: 10px; }

  /* ---------- 共用元件 ---------- */
  .panelbox { border: 1px solid var(--line); border-radius: 12px; background: var(--bg2); padding: 14px 16px; }
  .secthd { font-size: 13px; font-weight: 700; color: var(--mute); margin-bottom: 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .secthd em { font-style: normal; font-size: 11.5px; font-weight: 400; color: var(--foot); }
  .ctrls { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 12.5px; }
  .clab { color: var(--foot); font-size: 12px; margin-right: 2px; }
  .cgap { width: 14px; }
  .chip { --c: var(--mem); padding: 4px 10px; border-radius: 999px; cursor: pointer; background: var(--bg2); color: var(--mute); border: 1px solid var(--line); font-size: 12.5px; transition: all .12s; }
  .chip:hover { color: var(--ink); border-color: var(--c); }
  .chip.on { color: var(--bg); background: var(--c); border-color: var(--c); font-weight: 700; }
  .chip:disabled { opacity: .35; cursor: not-allowed; }
  .btn { padding: 4px 11px; border-radius: 8px; cursor: pointer; background: var(--bg3); color: var(--ink); border: 1px solid var(--line); font-size: 12.5px; }
  .btn:hover { border-color: var(--mem); }
  input[type=range] { accent-color: var(--mem); width: 160px; vertical-align: middle; }
  .val { font-family: Menlo, monospace; color: var(--mem); font-weight: 700; min-width: 86px; display: inline-block; }

  /* ---------- 第 1 層：拓樸 ---------- */
  #topo { width: 100%; height: auto; display: block; }
  .t-box { fill: var(--bg3); stroke: var(--line); stroke-width: 1.2; }
  .t-pool { fill: none; stroke: var(--line); stroke-width: 1.2; }
  .t-pool.pre { stroke: var(--comp); stroke-opacity: .55; }
  .t-pool.dec { stroke: var(--mem); stroke-opacity: .55; }
  .t-dom { fill: none; stroke: var(--comp); stroke-width: 1.1; stroke-dasharray: 4 3; stroke-opacity: .75; }
  .t-gpu { fill: var(--bg3); stroke: var(--foot); stroke-width: .8; }
  .t-gpu.pre { fill: var(--comptint); stroke: var(--comp); }
  .t-gpu.dec { fill: var(--memtint); stroke: var(--mem); }
  .t-fab { fill: var(--memtint); stroke: var(--mem); stroke-width: 1.2; }
  .t-txt { fill: var(--ink); font-size: 12.5px; font-weight: 700; }
  .t-sub { fill: var(--mute); font-size: 10.5px; }
  .t-tiny { fill: var(--foot); font-size: 9.5px; }
  .t-line { stroke: var(--foot); stroke-width: 1.4; fill: none; }
  .hl { opacity: .07; transition: opacity .25s; }
  .hl.on { opacity: 1; }
  .hl path, .hl line { fill: none; stroke-width: 3; stroke-linecap: round; }
  .hl.on .flow { stroke-dasharray: 9 7; animation: flow .9s linear infinite; }
  .hl .c-req { stroke: var(--ink); }
  .hl .c-kv  { stroke: var(--mem); }
  .hl .c-up  { stroke: var(--comp); }
  .hl .c-net { stroke: var(--mem); }
  .hl .c-w   { stroke: var(--purp); }
  .hl text { font-size: 11.5px; font-weight: 700; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
  @keyframes flow { to { stroke-dashoffset: -16; } }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 11px; color: var(--mute); margin-top: 6px; }
  .legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; margin-right: 5px; vertical-align: 3px; }
  table.dt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.dt th, table.dt td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; line-height: 1.45; }
  table.dt th { color: var(--foot); font-weight: 400; font-size: 11.5px; background: var(--bg); }
  table.dt tr.sel td { background: var(--bg3); }
  table.dt tr { cursor: pointer; }
  table.dt td.name { font-weight: 700; white-space: nowrap; }
  .verdict { font-weight: 700; }

  /* ---------- 第 2 層：泳道 ---------- */
  #swim { width: 100%; height: auto; display: block; }
  .lane-lab { font-size: 12px; font-weight: 700; }
  .lane-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
  .st { cursor: pointer; transition: opacity .25s; }
  .st.fut { opacity: .2; }
  .st.past { opacity: .5; }
  .st .sw { stroke: var(--mute); stroke-width: 1.8; }
  .st .head { fill: var(--mute); stroke: none; }
  .st.kv .sw { stroke-width: 3.2; }
  .st.cur .sw { stroke: var(--ink); }
  .st.cur .head { fill: var(--ink); }
  .st.kv.cur .sw { stroke: var(--mem); }
  .st.kv.cur .head { fill: var(--mem); }
  .st .box { fill: var(--bg3); stroke: var(--line); stroke-width: 1.3; }
  .st.cur .box.l0 { stroke: var(--ink); } .st.cur .box.l1 { stroke: var(--comp); fill: var(--comptint); } .st.cur .box.l2 { stroke: var(--mem); fill: var(--memtint); }
  .st .blab { fill: var(--ink); font-size: 11.5px; font-weight: 700; }
  .st .mlab { fill: var(--mute); font-size: 11px; font-weight: 700; paint-order: stroke; stroke: var(--bg2); stroke-width: 5px; }
  .st.cur .mlab { fill: var(--ink); }
  .st .badge { fill: var(--bg3); stroke: var(--line); }
  .st.cur .badge { fill: var(--mem); stroke: var(--mem); }
  .st .bnum { fill: var(--mute); font-size: 10.5px; font-weight: 700; }
  .st.cur .bnum { fill: var(--bg); }
  .stepbox { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 13px; line-height: 1.6; color: var(--mute); min-height: 44px; }
  .stepbox b { color: var(--ink); }

  /* ---------- 第 2 層：對數長條 ---------- */
  .lb-row { display: grid; grid-template-columns: 210px 1fr 84px; align-items: center; gap: 10px; margin-bottom: 7px; cursor: pointer; }
  .lb-row .nm { font-size: 12px; color: var(--mute); text-align: right; line-height: 1.3; }
  .lb-row.sel .nm { color: var(--ink); font-weight: 700; }
  .lb-track { position: relative; height: 22px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .lb-bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--memtint); border-right: 2px solid var(--mem); transition: width .35s cubic-bezier(.4,0,.2,1); }
  .lb-row.sel .lb-bar { background: var(--mem); }
  .lb-band { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, rgba(251,113,133,.16) 0 5px, transparent 5px 10px); border-left: 1px dashed var(--warn); border-right: 1px dashed var(--warn); }
  .lb-mark { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--good); }
  .lb-row .ms { font-family: Menlo, monospace; font-size: 12px; font-weight: 700; color: var(--mem); }
  .lb-axis { display: grid; grid-template-columns: 210px 1fr 84px; gap: 10px; font-family: Menlo, monospace; font-size: 10px; color: var(--foot); }
  .lb-axis .ticks { position: relative; height: 26px; }
  .lb-axis .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .lb-axis .ticks span.ref { top: 12px; font-family: "PingFang TC", sans-serif; }

  /* ---------- 第 3 層：decode 網格 ---------- */
  #dec { width: 100%; height: auto; display: block; overflow: visible; }
  .g-frame { fill: none; stroke: var(--comp); stroke-width: 1.2; stroke-dasharray: 4 3; stroke-opacity: .7; }
  .g-lab { fill: var(--foot); font-size: 10px; }
  .cell { fill: var(--bg3); stroke: var(--line); stroke-width: 1; transition: fill .25s, stroke .25s; }
  .cell.idle { fill: none; stroke: var(--line); stroke-opacity: .35; }
  #dec[data-phase="0"] .cell:not(.idle) { fill: var(--memtint); stroke: var(--mem); }
  .cell.src { stroke: var(--ink) !important; stroke-width: 2.2 !important; }
  #dec[data-phase="1"] .cell.dest, #dec[data-phase="2"] .cell.dest { stroke: var(--purp); stroke-width: 2; }
  #dec[data-phase="3"] .cell.dest { fill: var(--comptint); stroke: var(--comp); stroke-width: 2; }
  #dec[data-phase="4"] .cell.dest { stroke: var(--purp); stroke-width: 2; }
  .ln { fill: none; stroke-width: 2.2; opacity: 0; transition: opacity .2s; }
  .ln.up { stroke: var(--comp); }
  .ln.net { stroke: var(--mem); }
  #dec[data-phase="2"] .ln, #dec[data-phase="4"] .ln { opacity: .95; stroke-dasharray: 7 6; animation: flow .7s linear infinite; }
  #dec[data-phase="4"] .ln { animation-direction: reverse; }
  .selftag { fill: var(--purp); font-size: 9.5px; font-weight: 700; opacity: 0; }
  #dec[data-phase="1"] .selftag, #dec[data-phase="2"] .selftag, #dec[data-phase="3"] .selftag { opacity: 1; }
  .phases { display: flex; gap: 6px; flex-wrap: wrap; }
  .phase { padding: 4px 10px; border-radius: 7px; font-size: 12px; cursor: pointer; background: var(--bg); color: var(--foot); border: 1px solid var(--line); }
  .phase.on { background: var(--mem); color: var(--bg); border-color: var(--mem); font-weight: 700; }
  .layerctr { margin-left: auto; font-family: Menlo, monospace; font-size: 12px; color: var(--mute); }

  .hbm { display: flex; height: 38px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); }
  .hbm span { display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; color: var(--bg); white-space: nowrap; overflow: hidden; padding: 0 6px; transition: flex .35s; }
  .h-w { background: var(--foot); }
  .h-kv { background: var(--mem); }
  .h-over { background: var(--warntint); color: var(--warn) !important; }

  /* ---------- 第 4 層：時間帳 ---------- */
  .lg-row { display: grid; grid-template-columns: 170px 1fr 120px; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
  .lg-row.cur { border-color: var(--comp); background: var(--bg3); }
  .lg-row .nm { font-size: 13px; font-weight: 700; line-height: 1.3; }
  .lg-row .nm small { display: block; font-weight: 400; color: var(--foot); font-size: 11px; }
  .lg-track { position: relative; height: 30px; }
  .lg-bar { display: flex; height: 100%; border-radius: 5px; overflow: hidden; transition: width .4s cubic-bezier(.4,0,.2,1); }
  .lg-bar span { display: flex; align-items: center; justify-content: center; font-family: Menlo, monospace; font-size: 10.5px; font-weight: 700; color: var(--bg); white-space: nowrap; overflow: hidden; transition: flex .4s cubic-bezier(.4,0,.2,1); }
  .s-comp { background: var(--comp); }
  .s-ovl { background: repeating-linear-gradient(135deg, var(--comp) 0 6px, var(--mem) 6px 12px); }
  .s-comm { background: var(--mem); }
  .lg-row .tot { font-family: Menlo, monospace; font-size: 13px; font-weight: 700; text-align: right; }
  .lg-row .tot small { display: block; font-size: 10.5px; color: var(--foot); font-weight: 400; }
  .lg-scale { display: grid; grid-template-columns: 170px 1fr 120px; gap: 12px; padding: 0 8px; font-family: Menlo, monospace; font-size: 10px; color: var(--foot); }
  .lg-scale .ticks { position: relative; height: 14px; }
  .lg-scale .ticks span { position: absolute; transform: translateX(-50%); }
  .insight { font-size: 13px; line-height: 1.75; color: var(--mute); }
  .insight b { color: var(--ink); }
  .insight .hi { color: var(--comp); font-weight: 700; font-family: Menlo, monospace; }
  .anchors { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .anchor { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 12px; line-height: 1.55; color: var(--mute); }
  .anchor h5 { font-size: 12.5px; color: var(--ink); margin-bottom: 3px; }
  .anchor b { color: var(--mem); }
  .anchor .src { color: var(--foot); font-size: 10.5px; margin-top: 4px; }
</style>
</head>
<body>

<div id="topbar">
  <div id="crumbs"></div>
  <div id="hwsw"></div>
  <div id="hint"><kbd>1</kbd>–<kbd>4</kbd> 切層 · <kbd>H</kbd><kbd>B</kbd><kbd>G</kbd> 切硬體 · <kbd>空白鍵</kbd> 播放／暫停</div>
</div>

<div id="stage">
  <div id="canvas"></div>
  <div id="panel">
    <h2><span class="lv" id="p-lv"></span><span id="p-title"></span></h2>
    <p class="desc" id="p-desc"></p>
    <table class="facts"><tbody id="p-facts"></tbody></table>
    <div class="teach" id="p-teach"></div>
    <div class="caveat" id="p-caveat"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// 情境：DeepSeek-V3（61 層、58 層 MoE、256 routed 專家選 8、hidden 7168、MLA）
// 主角：SGLang 96×H100 —— prefill 4 台（EP32）、decode 9 台（EP72）、每卡 256 序列
// 對照：B200 8 卡機、GB200 NVL72
// 所有頻寬一律「每方向」。計算模型見 notes/class4-models-to-racks.md §6
// ─────────────────────────────────────────────────────────────

const HW = {
  h100: {
    key: "h", name: "H100 8 卡機", short: "H100 8 卡", tag: "主角 · SGLang 96×H100",
    domain: 8, upDir: 450, upShort: "NVLink 4",
    upLabel: "NVLink 4 · 每方向 450 GB/s（900 雙向）· NVSwitch",
    nic: 50, nicLabel: "每卡 400G ≈ 50 GB/s（原文未載明，以 DGX H100 典型配置估）", hbm: 80,
    anchor: "decode <b>2,785 tok/s／GPU</b>（22,282／node ÷ 8；2K 輸入、每卡 256 序列、ITL ≈ 100 ms）",
    src: "LMSYS 2025-05-05（單一來源）",
  },
  b200: {
    key: "b", name: "B200 8 卡機", short: "B200 8 卡", tag: "Blackwell · 8 卡一域",
    domain: 8, upDir: 900, upShort: "NVLink 5",
    upLabel: "NVLink 5 · 每方向 900 GB/s（1.8 TB/s 雙向）· NVSwitch",
    nic: 50, nicLabel: "ConnectX-7 400G × 8", hbm: 180,
    anchor: "<b>941 tok/s／GPU</b> @ 125 tok/s/user（R1 FP4、decode EP8、MTP、Dynamo + TRT-LLM）· $0.576／1M",
    src: "SemiAnalysis InferenceX 2026-05-23（第三方）",
  },
  gb200: {
    key: "g", name: "GB200 NVL72", short: "GB200 NVL72", tag: "Blackwell · 72 卡一域",
    domain: 72, upDir: 900, upShort: "NVLink 5",
    upLabel: "NVLink 5 · 每方向 900 GB/s · 72 卡一個 NVSwitch 域",
    nic: 50, nicLabel: "ConnectX-7 400G（DGX GB200 文件）", hbm: 186,
    anchor: "<b>4,130 tok/s／GPU</b> @ 125 tok/s/user（decode EP16，其餘條件同 B200）· $0.149／1M",
    src: "SemiAnalysis InferenceX 2026-05-23（第三方）",
  },
};
const HW_ORDER = ["h100", "b200", "gb200"];

// ── 模型常數 ──
const M = {
  H: 7168, TOPK: 8, L_MOE: 58, B: 256, SLOTS: 288,
  OVH_MS: 0.11,                       // 每層固定開銷（DeepEP 實測殘差）
  COMPUTE_MS: 74.5,                   // 一步的計算時間（由 H100 實測反推，換硬體刻意不變）
  TBO_HIDE: 0.65,                     // TBO 能藏進計算裡的通訊比例（由 TBO +35% 反推）
  EXPERT_GB: 3 * 7168 * 2048 * 58 / 1e9,   // 一個專家槽 × 58 層，FP8 ≈ 2.55 GB
  NONEXP_GB: 16.3,                    // attention 等非專家權重（FP8）+ embedding/LM head（BF16）
  WEIGHTS_GB: 688.6,
};
const PREC = {
  bf16: { B: 2, label: "BF16" },
  fp8:  { B: 1, label: "FP8" },
  fp4:  { B: 0.5625, label: "FP4" },     // 4 bit + 每 16 值 1 byte scale
};
const ATTN = {
  mha:   { label: "MHA", sub: "同骨架假想：128 頭 × 128 維", perTok: 61 * 2 * 128 * 128 * 2 },
  gqa:   { label: "GQA", sub: "Llama-3-70B：8 KV 頭 × 80 層", perTok: 80 * 2 * 8 * 128 * 2 },
  mla16: { label: "MLA · BF16", sub: "DeepSeek-V3（512 + 64）× 61 層", perTok: 61 * 576 * 2 },
  mla8:  { label: "MLA · FP8", sub: "同上，KV 存 FP8", perTok: 61 * 576 },
};
const LINKS = {
  rdma: { label: "跨機 RDMA · 400G", gbps: 49.5, note: "llm-d 400G IB 實測（UCX）49.5 GB/s" },
  nvl:  { label: "NVL72 域內 NVLink 5", gbps: 900, note: "每方向 900 GB/s 理論上限（prefill／decode 同在一個 NVL72 時才可行）" },
};
const TOKENS = [1000, 2000, 4989, 16000, 64000, 128000];
const EPS = [8, 16, 32, 72, 144];
const MEASURED_STEP_MS = 92;          // 8 × 256 ÷ 22,282
const TTFT = [2000, 5000];

function commModel(hwKey, ep, prec) {
  const hw = HW[hwKey];
  const uniq = ep * (1 - Math.pow(1 - 1 / ep, M.TOPK));
  const remote = uniq * (ep - 1) / ep;
  const dEff = Math.min(hw.domain, ep);
  const intra = ep > 1 ? remote * (dEff - 1) / (ep - 1) : 0;
  const cross = Math.max(0, remote - intra);
  const legs = [PREC[prec].B, 2].map((bpe) => {
    const bi = M.B * intra * M.H * bpe, bc = M.B * cross * M.H * bpe;
    return { bytes: bi + bc, ms: Math.max(bi / (hw.upDir * 1e9), bc / (hw.nic * 1e9)) * 1e3 };
  });
  const layerMs = legs[0].ms + legs[1].ms + M.OVH_MS;
  return { uniq, remote, crossFrac: remote ? cross / remote : 0, dispBytes: legs[0].bytes, combBytes: legs[1].bytes, layerMs, stepMs: layerMs * M.L_MOE };
}
function stepModel(hwKey, ep, prec, tbo) {
  const c = commModel(hwKey, ep, prec);
  const hidden = tbo ? Math.min(c.stepMs * M.TBO_HIDE, M.COMPUTE_MS) : 0;
  return { ...c, hidden, visible: c.stepMs - hidden, total: M.COMPUTE_MS + c.stepMs - hidden };
}
const weightsGB = (ep) => (M.SLOTS / ep + 1) * M.EXPERT_GB + M.NONEXP_GB;

  c2.append(r, v);

  Object.entries(LINKS).forEach(([k, L]) => {
    const b = el("button", "chip" + (S.link === k ? " on" : ""), L.label);
    if (k === "nvl" && hw.domain < 72) { b.disabled = true; b.title = "只有 prefill 與 decode 同在一個 NVL72 域內才能走 NVLink"; }

  const cb = el("div", "panelbox"); cb.id = "kvchart";

  updateSwim();

  timer = setInterval(() => { if (S.playing) { S.step = (S.step + 1) % 7; updateSwim(); } }, 1900);
}

function arrow(g, x1, y1, x2, y2) {
  sv("line", { x1, y1, x2, y2, class: "sw" }, g);
  const a = Math.atan2(y2 - y1, x2 - x1), L = 9, w = 5;
  const pts = [[x2, y2], [x2 - L * Math.cos(a) + w * Math.sin(a), y2 - L * Math.sin(a) - w * Math.cos(a)], [x2 - L * Math.cos(a) - w * Math.sin(a), y2 - L * Math.sin(a) + w * Math.cos(a)]];
  sv("polygon", { points: pts.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" "), class: "head" }, g);
}

// ═════════════════════════════════════════════════════════════
// 第 3 層：Decode 一步 —— 一個 token 的 8 個專家落在哪
// ═════════════════════════════════════════════════════════════
const PHASES = [
  { chip: "① Attention", text: "每張卡只算<b>自己那批請求</b>（每卡 256 條序列）的 MLA attention，KV 只存在自己卡上——這一步不需要跟任何卡說話。" },
  { chip: "② Gate", text: "gate 替每個 token 從 256 個專家裡挑 8 個。紫框＝這個 token（白框那張卡上的某一條序列）的專家所在的卡。" },
  { chip: "③ Dispatch", text: "把 token 的 hidden state（7168 維）送去專家所在的卡，<b>同一張目的卡只送一次</b>。琥珀色線＝域內（NVLink／xGMI），青色線＝出機器走 RDMA。" },
  { chip: "④ Experts", text: "每張卡用 grouped GEMM 一次算完送來的所有 token（DeepGEMM）。" },
  { chip: "⑤ Combine", text: "專家輸出送回原卡、加權合併。combine 用 BF16，位元組是 FP8 dispatch 的兩倍。" },
  { chip: "⑥ 下一層", text: "這只是一層。每產一個字要走完 58 層 MoE——dispatch＋combine 共 <b>116 次</b>，而且每一次都得等所有卡到齊。" },
];

function rng(seed) { let s = seed >>> 0; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
function sampleDests(ep, seed) {
  const r = rng(seed * 7919 + 17);
  const ex = new Set();
  while (ex.size < M.TOPK) ex.add(Math.floor(r() * 256));
  return [...new Set([...ex].map((e) => Math.floor(e * ep / 256)))];
}

function gridLayout(ep, domain) {
  const groups = [];
  if (domain >= 72) {
    const nG = Math.ceil(ep / 72), cell = 19, gap = 4, cols = 9, rows = 8;
    const gw = cols * (cell + gap) + gap + 6, gh = rows * (cell + gap) + gap + 22;
    for (let g = 0; g < nG; g++) {
      const gx = 12 + g * (gw + 28), gy = 8, cells = [];
      for (let k = 0; k < 72; k++) {
        const rank = g * 72 + k;
        cells.push({ rank, g, x: gx + 3 + gap + (k % cols) * (cell + gap), y: gy + 18 + gap + Math.floor(k / cols) * (cell + gap), idle: rank >= ep });
      }
      groups.push({ x: gx, y: gy, w: gw, h: gh, label: `NVL72 機櫃 ${"AB"[g]} · 一個 NVLink 域`, cells });
    }
    return { groups, W: 12 + nG * (gw + 28), H: gh + 16, cell };
  }
  const nG = Math.ceil(ep / 8), cell = 22, gap = 4, cols = 4;
  const gw = cols * (cell + gap) + gap + 6, gh = 2 * (cell + gap) + gap + 20;
  const perRow = Math.min(nG, 6);
  for (let g = 0; g < nG; g++) {
    const gx = 12 + (g % perRow) * (gw + 16), gy = 8 + Math.floor(g / perRow) * (gh + 16), cells = [];
    for (let k = 0; k < 8; k++) {
      cells.push({ rank: g * 8 + k, g, x: gx + 3 + gap + (k % cols) * (cell + gap), y: gy + 16 + gap + Math.floor(k / cols) * (cell + gap), idle: false });
    }
    groups.push({ x: gx, y: gy, w: gw, h: gh, label: `node ${g + 1}`, cells });
  }
  return { groups, W: 12 + perRow * (gw + 16), H: 8 + Math.ceil(nG / perRow) * (gh + 16), cell };
}

function buildDecode() {
  const hw = HW[S.hw];
  const wrap = el("div", "lvwrap");

  const c1 = el("div", "ctrls");
  c1.appendChild(el("span", "clab", "EP 大小："));
  EPS.forEach((e) => {
    const b = el("button", "chip" + (S.ep === e ? " on" : ""), "EP" + e);
    b.onclick = () => { S.ep = e; render(); };
    c1.appendChild(b);
  });
  c1.appendChild(el("span", "cgap"));
  c1.appendChild(el("span", "clab", "dispatch 精度："));
  Object.entries(PREC).forEach(([k, P]) => {
    const b = el("button", "chip" + (S.prec === k ? " on" : ""), P.label);
    b.style.setProperty("--c", "var(--purp)");
    b.onclick = () => { S.prec = k; render(); };
    c1.appendChild(b);
  });
  c1.appendChild(el("span", "cgap"));
  const rs = el("button", "btn", "↻ 換一個 token"); rs.onclick = () => { S.seed++; render(); };
  const pb = el("button", "btn", S.playing ? "❚❚ 暫停" : "▶ 播放"); pb.id = "playbtn";
  pb.onclick = () => { S.playing = !S.playing; pb.textContent = S.playing ? "❚❚ 暫停" : "▶ 播放"; };
  c1.append(rs, pb);
  wrap.appendChild(c1);

  const box = el("div", "panelbox");
  const ph = el("div", "phases");
  PHASES.forEach((p, i) => {
    const c = el("div", "phase", p.chip); c.dataset.i = i;
    c.onclick = () => { S.playing = false; pb.textContent = "▶ 播放"; S.phase = i; updatePhase(); };
    ph.appendChild(c);
  });
  ph.appendChild(el("div", "layerctr", "")).id = "layerctr";
  box.appendChild(ph);
  box.appendChild(el("div", "", "")).style.height = "10px";

  const lay = gridLayout(S.ep, hw.domain);
  const svg = sv("svg", { id: "dec", viewBox: `0 0 ${lay.W} ${lay.H}`, "data-phase": S.phase });
  svg.style.width = Math.round(Math.min(Math.max(lay.W * 1.3, 320), 1100)) + "px";
  svg.style.maxWidth = "100%";
  const all = [];
  lay.groups.forEach((G) => {
    sv("rect", { x: G.x, y: G.y, width: G.w, height: G.h, rx: 7, class: "g-frame" }, svg);
    st(svg, G.x + 6, G.y + 12, G.label, "g-lab");
    G.cells.forEach((c) => all.push(c));
  });
  const byRank = {};
  all.forEach((c) => { if (!c.idle) byRank[c.rank] = c; });
  const dests = sampleDests(S.ep, S.seed);
  const src = byRank[0];
  const lines = sv("g", {}, svg);
  all.forEach((c) => {
    const cls = "cell" + (c.idle ? " idle" : "") + (c.rank === 0 ? " src" : "") + (!c.idle && dests.includes(c.rank) ? " dest" : "");
    sv("rect", { x: c.x, y: c.y, width: lay.cell, height: lay.cell, rx: 4, class: cls }, svg);
  });
  dests.forEach((r) => {
    const d = byRank[r];
    if (!d) return;
    if (r === 0) { st(svg, src.x + lay.cell / 2, src.y - 3, "本卡", "selftag", "middle"); return; }
    const x1 = src.x + lay.cell / 2, y1 = src.y + lay.cell / 2, x2 = d.x + lay.cell / 2, y2 = d.y + lay.cell / 2;
    const mx = (x1 + x2) / 2, my = Math.min(y1, y2) - 26 - Math.abs(x2 - x1) * 0.06;
    sv("path", { d: `M${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`, class: "ln " + (d.g === src.g ? "up" : "net") }, lines);
  });
  box.appendChild(svg);
  const lg = el("div", "legend",
    '<span><i style="border-color:var(--ink)"></i>白框＝發出 token 的卡</span>' +
    '<span><i style="border-color:var(--purp)"></i>紫框＝8 個專家所在的卡</span>' +
    `<span><i style="border-color:var(--comp)"></i>域內（${hw.upShort}）</span>` +
    '<span><i style="border-color:var(--mem)"></i>出機器（RDMA）</span>');
  box.appendChild(lg);
  wrap.appendChild(box);

  const w = weightsGB(S.ep), fits = w <= hw.hbm;
  const hb = el("div", "panelbox");
  hb.appendChild(el("div", "secthd", `每張 ${hw.short} 的 HBM（${hw.hbm} GB） <em>EP 越大，每卡放的專家越少，剩下的 HBM 越多拿去放 KV、開大 batch</em>`));
  const bar = el("div", "hbm");
  if (fits) {
    const a = el("span", "h-w", `權重 ≈ ${w.toFixed(0)} GB（${M.SLOTS / S.ep} 個專家 + 共用部分）`); a.style.flex = w;
    const b = el("span", "h-kv", `剩給 KV／activation ≈ ${(hw.hbm - w).toFixed(0)} GB`); b.style.flex = hw.hbm - w;
    bar.append(a, b);
  } else {
    const a = el("span", "h-over", `權重 ≈ ${w.toFixed(0)} GB ＞ ${hw.hbm} GB：這個 EP 大小在這張卡上放不下`); a.style.flex = 1;
    bar.append(a);
  }
  hb.appendChild(bar);
  wrap.appendChild(hb);

  canvas.appendChild(wrap);
  updatePhase();
  timer = setInterval(() => {
    if (!S.playing) return;
    S.phase = (S.phase + 1) % PHASES.length;
    if (S.phase === 0) S.layer = S.layer % M.L_MOE + 1;
    updatePhase();
  }, 1150);
}

function updatePhase() {
  const svg = document.getElementById("dec");
  if (svg) svg.setAttribute("data-phase", S.phase);
  document.querySelectorAll(".phase").forEach((c) => c.classList.toggle("on", +c.dataset.i === S.phase));
  const lc = document.getElementById("layerctr");
  if (lc) lc.textContent = `MoE 第 ${S.layer} 層／58`;
  updatePanel();
}

function panelDecode() {
  const hw = HW[S.hw];
  const c = commModel(S.hw, S.ep, S.prec);
  const w = weightsGB(S.ep);
  const nDom = Math.ceil(S.ep / hw.domain);
  let teach;
  if (w > hw.hbm) teach = `<b>EP${S.ep} 時每張卡要放 ${M.SLOTS / S.ep} 個專家，${hw.short} 的 ${hw.hbm} GB 裝不下。</b>這就是一台 H100 服務不了 DeepSeek 的原因——非拆到更多卡上不可。`;
  else if (c.crossFrac > 0 && hw.domain >= 72) teach = `<b>EP${S.ep} 橫跨 ${nDom} 個 NVL72 機櫃，${pct(c.crossFrac)} 的交換得跨機櫃走 RDMA。</b>每層通訊從 EP72 的 ${fmtMs(commModel(S.hw, 72, S.prec).layerMs)} 跳到 ${fmtMs(c.layerMs)}——域一旦裝不下整個 EP，最常搬的資料又回到慢車道。`;
  else if (c.crossFrac > 0) teach = `<b>EP${S.ep} 放在 ${hw.domain} 卡一域的機器上，${pct(c.crossFrac)} 的交換得出機器。</b>DeepEP 靠 GPU 直接敲網卡門鈴（IBGDA）、固定 buffer 讓 CUDA Graph 錄得下來，把每層壓到 ${fmtMs(c.layerMs)}——但 400G 的線速就是天花板。按 <b>G</b> 切到 NVL72 比較。`;
  else teach = `<b>整個 EP${S.ep} 都在同一個 scale-up 域裡，交換完全不出${hw.domain >= 72 ? "機櫃" : "機器"}。</b>每層通訊只剩 ${fmtMs(c.layerMs)}，大部分是固定開銷。${hw.domain < 72 ? "但 EP 小代表每卡專家多、HBM 留給 KV 的少——看下方 HBM 條。" : ""}`;
  return {
    title: "Decode 一步：attention 各算各的，MoE 大家一起交換",
    desc: PHASES[S.phase].text,
    facts: [
      ["硬體 · EP", `${hw.short} · EP${S.ep}（${nDom} 個域）`],
      ["每卡 routed 專家", `${M.SLOTS / S.ep} 個（288 槽 ÷ ${S.ep}）`],
      ["一個 token 送往", `≈ ${c.remote.toFixed(1)} 張其他卡`],
      ["其中出機器走 RDMA", pct(c.crossFrac)],
      ["每層 dispatch ＋ combine", `${fmtBytes(c.dispBytes)} ＋ ${fmtBytes(c.combBytes)}`],
      ["每層通訊（模型）", fmtMs(c.layerMs)],
      ["× 58 層 ＝ 每步通訊", fmtMs(c.stepMs)],
      ["每卡權重 / HBM", `${w.toFixed(0)} / ${hw.hbm} GB${w > hw.hbm ? " ✗" : ""}`],
    ],
    teach,
    caveat: "教學模型：均勻路由（忽略 group-limited routing 與 EPLB 熱點）、每卡 256 條序列；每段取「域內 ÷ scale-up 頻寬」與「跨域 ÷ 網卡頻寬」較慢者，再加每層 0.11 ms 固定開銷。以 DeepEP 實測校準：純線速在 EP≥32 能解釋實測延遲的 75–95%。權重以 FP8、288 個專家槽計，未扣 activation 與通訊 buffer。",
  };
}

function buildLedger() {
  const wrap = el("div", "lvwrap");
  const c1 = el("div", "ctrls");
  c1.appendChild(el("span", "clab", "EP 大小："));
  EPS.forEach((e) => {
    const b = el("button", "chip" + (S.ep === e ? " on" : ""), "EP" + e);
    b.onclick = () => { S.ep = e; render(); };

  });
  c1.appendChild(el("span", "cgap"));
  c1.appendChild(el("span", "clab", "dispatch 精度："));
  Object.entries(PREC).forEach(([k, P]) => {
    const b = el("button", "chip" + (S.prec === k ? " on" : ""), P.label);
    b.style.setProperty("--c", "var(--purp)");
    b.onclick = () => { S.prec = k; render(); };
    c1.appendChild(b);
  });
  c1.appendChild(el("span", "cgap"));
  const tb = el("button", "chip" + (S.tbo ? " on" : ""), "Two-batch overlap");
  tb.style.setProperty("--c", "var(--good)");
  tb.onclick = () => { S.tbo = !S.tbo; render(); };
  c1.appendChild(tb);
  wrap.appendChild(c1);

  const R = {};
  HW_ORDER.forEach((k) => { R[k] = stepModel(k, S.ep, S.prec, S.tbo); });
  const maxT = Math.ceil(Math.max(...HW_ORDER.map((k) => M.COMPUTE_MS + R[k].stepMs)) / 20) * 20;

  const box = el("div", "panelbox");
  box.appendChild(el("div", "secthd", `一個 decode 步的牆鐘時間（EP${S.ep}、每卡 256 序列、dispatch ${PREC[S.prec].label}） <em>橘＝計算　斜紋＝被 TBO 藏進計算裡的通訊　藍＝還露在外面的通訊</em>`));
  HW_ORDER.forEach((k) => {
    const hw = HW[k], r = R[k];
    const row = el("div", "lg-row" + (S.hw === k ? " cur" : ""));
    row.appendChild(el("div", "nm", `${hw.name}<small>${hw.tag} · 域 ${hw.domain}</small>`));
    const track = el("div", "lg-track");
    const bar = el("div", "lg-bar");
    bar.style.width = (r.total / maxT * 100) + "%";
    const segs = S.tbo
      ? [["s-comp", M.COMPUTE_MS - r.hidden, "計算 " + Math.round(M.COMPUTE_MS)], ["s-ovl", r.hidden, ""], ["s-comm", r.visible, "通訊 " + fmtMs(r.visible)]]
      : [["s-comp", M.COMPUTE_MS, "計算 " + Math.round(M.COMPUTE_MS)], ["s-comm", r.stepMs, "通訊 " + fmtMs(r.stepMs)]];
    segs.forEach(([cls, v, t]) => { const s = el("span", cls, v / r.total > 0.12 ? t : ""); s.style.flex = Math.max(v, 0.0001); bar.appendChild(s); });
    track.appendChild(bar);
    row.appendChild(track);
    const x = R.h100.total / r.total;
    row.appendChild(el("div", "tot", `${fmtMs(r.total)}<small>${k === "h100" ? "基準" : "相對 H100 ×" + x.toFixed(2)}</small>`));
    row.onclick = () => { S.hw = k; render(); };
    box.appendChild(row);
  });
  const sc = el("div", "lg-scale");
  sc.appendChild(el("div"));
  const ticks = el("div", "ticks");
  for (let v = 0; v <= maxT; v += 20) { const s = el("span", "", v + " ms"); s.style.left = (v / maxT * 100) + "%"; ticks.appendChild(s); }
  sc.append(ticks, el("div"));
  box.appendChild(sc);
  wrap.appendChild(box);

  const ins = el("div", "panelbox insight");
  const h = R.h100, b = R.b200, g = R.gb200;
  if (S.ep <= 8) {
    ins.innerHTML = `<b>EP8 時交換全部留在同一台機器裡，三種硬體的通訊都只剩固定開銷。</b>但別高興太早——H100 在 EP8 連權重都放不下（第 3 層的 HBM 條）。把 EP 拉大，差距才會出現。`;
  } else {
    ins.innerHTML =
      `<b>NVLink 快一倍（H100 → B200）：</b>每步通訊 <span class="hi">${fmtMs(h.stepMs)} → ${fmtMs(b.stepMs)}</span>。EP${S.ep} 時 ${pct(commModel("b200", S.ep, S.prec).crossFrac)} 的流量根本不在 NVLink 上。<br>` +
      `<b>域從 8 變 72（B200 → GB200）：</b>每步通訊 <span class="hi">${fmtMs(b.stepMs)} → ${fmtMs(g.stepMs)}</span>。決定性的數字是「一個域裡有幾張卡」，不是頻寬。<br>` +
      (S.tbo ? `<b>Two-batch overlap</b> 在 8 卡機上能藏住 <span class="hi">${fmtMs(h.hidden)}</span>，在 NVL72 上只有 <span class="hi">${fmtMs(g.hidden)}</span> 可藏——通訊變小，重疊的價值也跟著變小。` : `打開 <b>Two-batch overlap</b> 看看有多少通訊能藏進計算裡。`);
  }
  wrap.appendChild(ins);

  const an = el("div", "panelbox");
  an.appendChild(el("div", "secthd", "實測錨點 <em>條件各不相同（模型、精度、互動性、是否 MTP），只看量級，不可直接橫比</em>"));
  const grid = el("div", "anchors");
  HW_ORDER.forEach((k) => {
    const hw = HW[k];
    grid.appendChild(el("div", "anchor", `<h5>${hw.name}</h5>${hw.anchor}<div class="src">${hw.src}</div>`));
  });
  an.appendChild(grid);
  wrap.appendChild(an);
  canvas.appendChild(wrap);
}

function panelLedger() {
  const hw = HW[S.hw];
  const r = stepModel(S.hw, S.ep, S.prec, S.tbo);
  const noTbo = stepModel(S.hw, S.ep, S.prec, false);
  const base = stepModel("h100", S.ep, S.prec, S.tbo);
  return {
    title: "一步的時間帳：只換互連，哪一段變了",
    desc: "三種硬體跑同一個 decode 步。<b>計算時間刻意固定</b>（74.5 ms，由 H100 實測反推），只改 scale-up 域大小與頻寬，看通訊那一段怎麼變。點任一列切換右側細節。",
    facts: [
      ["硬體", hw.name],
      ["scale-up 域", `${hw.domain} 張 · ${hw.upLabel}`],
      ["算力網卡", hw.nicLabel],
      ["EP" + S.ep + " 出機器比例", pct(r.crossFrac)],
      ["每步通訊（模型）", fmtMs(r.stepMs)],
      ["一步：TBO 關 → 開", `${fmtMs(noTbo.total)} → ${fmtMs(stepModel(S.hw, S.ep, S.prec, true).total)}`],
      ["相對 H100（同 EP、同設定）", "×" + (base.total / r.total).toFixed(2)],
    ],
    teach: hw.domain >= 72
      ? `<b>模型只換互連，GB200 一步快 ×${(base.total / r.total).toFixed(2)}；實測每卡產出卻是 B200 的 4.4×。</b>差的那一截來自第 3 層的機制：域夠大，EP 就能開大、每卡專家更少、HBM 留給 KV 更多、batch 更大——再加上 Blackwell 計算本身更快。`
      : S.ep <= 8
      ? `<b>EP8 整個留在一台${hw.name}裡，通訊帳只剩固定開銷。</b>把 EP 拉大，看網卡什麼時候變成主角。`
      : `<b>${hw.name}的通訊帳幾乎全由網卡決定。</b>scale-up 頻寬再快，EP${S.ep} 的交換也只有一小部分走得到——這就是投影片第 25 頁說的「真瓶頸是域大小」。`,
    caveat: "計算時間 74.5 ms 與 TBO 藏住 65% 的通訊，都是由 LMSYS 96×H100 實測（一步 ≈ 92 ms、TBO +35%）反推的校準值；換硬體時刻意不變，以隔離互連這個變數。真實的 Blackwell 計算更快、batch 也能開更大。計算模型見 notes/class4-models-to-racks.md §6。",
  };
}

// ═════════════════════════════════════════════════════════════
// 主控
// ═════════════════════════════════════════════════════════════
const BUILDERS = [buildOverview, buildKV, buildDecode, buildLedger];
const PANELS = [panelOverview, panelKV, panelDecode, panelLedger];

function updatePanel() {
  const p = PANELS[S.lv]();
  document.getElementById("p-lv").textContent = `第 ${S.lv + 1} 層／4 · ${HW[S.hw].name}`;
  document.getElementById("p-title").textContent = p.title;
  document.getElementById("p-desc").innerHTML = p.desc;
  document.getElementById("p-facts").innerHTML = p.facts.map(([k, v]) => `<tr><td>${k}</td><td class="v">${v}</td></tr>`).join("");
  document.getElementById("p-teach").innerHTML = p.teach;
  document.getElementById("p-caveat").textContent = p.caveat;
}

function render() {
  clearInterval(timer); timer = null;
  const crumbs = document.getElementById("crumbs");
  crumbs.innerHTML = "";
  LEVELS.forEach((name, i) => {
    const c = el("div", "crumb" + (i === S.lv ? " active" : ""), name);
    c.onclick = () => go(i);
    crumbs.appendChild(c);
    if (i < LEVELS.length - 1) crumbs.appendChild(el("span", "sep", "›"));
  });
  const hwsw = document.getElementById("hwsw");
  hwsw.innerHTML = '<span class="lab">硬體</span>';
  HW_ORDER.forEach((k) => {
    const b = el("button", "hwbtn" + (S.hw === k ? " on" : ""), `${HW[k].short}<kbd>${HW[k].key.toUpperCase()}</kbd>`);
    b.onclick = () => { S.hw = k; render(); };
    hwsw.appendChild(b);
  });
  canvas.innerHTML = "";
  BUILDERS[S.lv]();
  updatePanel();
}

function go(i) { S.lv = (i + LEVELS.length) % LEVELS.length; S.playing = true; render(); canvas.scrollTop = 0; }

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if (k >= "1" && k <= "4") go(+k - 1);
  else if (e.key === "ArrowRight") go(S.lv + 1);
  else if (e.key === "ArrowLeft") go(S.lv - 1);
  else if (k === " ") {
    e.preventDefault();
    S.playing = !S.playing;
    const pb = document.getElementById("playbtn");
    if (pb) pb.textContent = S.playing ? "❚❚ 暫停" : "▶ 播放";
  } else {
    const hk = HW_ORDER.find((h) => HW[h].key === k);
    if (hk) { S.hw = hk; render(); }
  }
});

render();
</script>
